<!--告诉浏览器："这是一个 HTML5 标准的网页，请按照现代标准来渲染它。"-->
<!DOCTYPE html>

<!--告诉这个 HTML 文件："我要使用 Thymeleaf 模板引擎的语法，请识别 th: 开头的标签。"-->
<html xmlns:th="http://www.thymeleaf.org">

<!--放的是配置、样式、标题这些用户看不见但必须有的东西。 用户看到的内容都放在 <body> 里。-->
<head>
    <!--告诉浏览器用"UTF-8"编码方式来解析这个网页，这样汉字才不会乱码。-->
    <meta charset="UTF-8">

    <!--设置浏览器标签页上显示的文字标题-->
    <title>我的商城 - 商品列表</title>

    <!-- 在 HTML 页面内部写 CSS 样式，控制页面的外观 -->
    <style>
        /*
         * .goods-container 的样式
         * 这个类用在包裹所有商品卡片的最外层容器上
         */
        .goods-container {
            display: flex;      /* 弹性布局：让里面的商品卡片横着排列 */
            flex-wrap: wrap;    /* 允许换行：一行放不下时，自动换到下一行 */
            gap: 20px;          /* 卡片之间的间距：每个卡片之间间隔20像素 */
        }

        /*
         * .goods-card 的样式
         * 这个类用在每一个商品卡片上
         */
        .goods-card {
            border: 1px solid #ddd;  /* 边框：1像素粗，实线，浅灰色(#ddd) */
            padding: 15px;           /* 内边距：卡片内部内容与边框之间留15像素空白 */
            width: 200px;            /* 宽度：每个卡片固定200像素宽 */
            text-align: center;      /* 文字对齐：卡片内的文字水平居中 */
            align-items: center;     /* 图片水平居中 */
            flex-direction: column;display: flex; /* 竖直排列 */
        }

        /*
         * .goods-price 的样式
         * 这个类用在商品价格上
         */
        .goods-price {
            color: red;              /* 文字颜色：红色 */
            font-size: 20px;        /* 文字大小：20像素（比默认的16px大） */
        }
    </style>
</head>
<body>
<<!-- 页面大标题：直接写死，所有页面都显示"商品列表" -->
<h1 style="text-align: center;">商品列表</h1>

<!--
    搜索表单
    method="get"   → GET 方式提交，搜索关键字会显示在 URL 上（如 ?keyword=手机）
    action="/"     → 提交到首页（当前页面）
    margin-bottom  → 元素底部向外距离
-->
<form method="get" action="/" style="margin-bottom: 20px;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <!--
            输入框
            name="keyword"       → 参数名，后台用 @RequestParam("keyword") 接收
            placeholder="..."    → 输入框内的灰色提示文字
            th:value="${keyword}"→ 搜索后保留输入的值（不然搜索完输入框会变空）
            -->
            <input type="text" name="keyword" placeholder="输入商品名称搜索"
                   style="padding: 8px; width: 200px;"
                   th:value="${keyword}">
            <!-- 搜索按钮，type="submit" 表示点击后提交表单 -->
            <!-- padding 内边距 -->
            <button type="submit" style="padding: 8px 16px;">搜111索</button>

            <!--
               重置按钮
               a 超链接标签
               href="/" → 超链接地址
            -->
            <a href="/" style="padding: 8px 16px;">重置</a>
        </div>
        <div>
            <div th:if="${session.loginUser != null}" style="position: relative; display: inline-block;">
                <div style="padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                    当前用户：<span th:text="${session.loginUser.username}"></span>
                </div>
                <a href="/login" style="padding: 8px 16px;">切换账户</a>
            </div>
            <div>
                <div th:if="${session.loginUser == null}">
                    <a href="/login" style="padding: 8px 16px;">登录</a>
                    <a href="/register" style="padding: 8px 16px;">注册</a>
                </div>
            </div>
        </div>
    </div>
</form>

<!--
    商品容器：class="goods-container"
    CSS 里定义了这个类的样式：横着排列、自动换行、卡片间距20px
-->
<div class="goods-container">

    <!--
        单个商品卡片
        th:each="goods : ${goodsList}"
        - 这是 Thymeleaf 的循环语法
        - 遍历 Controller 传过来的 goodsList（商品列表）
        - 每遍历一次，生成一个 <div>，当前商品叫 goods

        class="goods-card"
        - CSS 样式：边框、内边距、固定宽度、文字居中
    -->
    <div class="goods-card" th:each="goods : ${goodsList}" style="">

        <!--
            商品图片
            th:src="${goods.image}"     → 动态设置图片地址，从 goods.image 取
            alt="商品图片"               → 图片加载失败时显示的文字
            style="width:150px;..."    → 直接写样式：宽150px，高150px
            onerror="..."              → JS 事件：图片加载失败时，换成默认图片 /images/default.jpg
                                        this.onerror=null 防止默认图片也失败时无限循环
        -->
        <img th:src="${goods.image}" alt="商品图片"
             style="width:150px;height:150px"
             onerror="this.src='/images/default.jpg'; this.onerror=null;">

        <!--
            商品名称
            th:text="${goods.name}"    → 动态显示商品名称
            标签内的"商品名称"是占位符，运行时会被真实数据替换
        -->
        <a th:href="@{/goods/{id}(id=${goods.id})}" th:text="${goods.name}">商品名称</a>

        <!--
            商品价格
            class="goods-price"        → CSS 样式：红色、20px大字号
            th:text="'¥' + ${goods.price}" → 动态拼接：¥符号 + 价格
            例如：¥99.00
        -->
        <p class="goods-price" th:text="'¥' + ${goods.price}">价格</p>

        <p th:text="${goods.detail}">描述</p>

        <p th:text="哈哈哈">测试文字</p>

        <p th:text="${goods.id}">商品ID</p>

        <!-- <p th:text="${currentTime}">时间</p> -->

    </div>
</div>
</body>
</html>
