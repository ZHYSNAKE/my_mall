<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>购买</title>
</head>
<body>
    <div style="width: 500px; margin: 0 auto;flex-direction: column;display: flex;align-items: center;text-align: center;gap: 30px">
        <div style="gap: 20px;display: flex;flex-direction: column">
            <img th:src="${goods.image}" alt="商品图片"
                 style="width:500px;height:auto;"
                 onerror="this.src='/images/default.jpg'; this.onerror=null;">

            <h1>商品名称： <span th:text="${goods.name}"></span>名字</h1>

            <p>价格： <span th:text=" ${goods.price} + '元' " ></span></p>

            <!-- 选择地址区域 -->
            <div style="border: 1px solid #ddd; padding: 15px; border-radius: 5px;">
                <p style="font-weight: bold;">选择收货地址</p>

                <!-- 地址下拉框，初始为空，等待JS填充 -->
                <select id="addressSelect" style="width: 100%; padding: 8px; border-radius: 4px;">
                    <option value="">加载中...</option>
                </select>

                <!-- 新增地址按钮 -->
                <button type="button" onclick="showAddAddressForm()" style="margin-top: 10px; padding: 5px 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    + 新增地址
                </button>
            </div>

            <!-- ========== 新增地址表单（默认隐藏） ========== -->
            <div id="addAddressForm" style="display: none; border: 1px solid #ddd; padding: 15px; border-radius: 5px; text-align: left;">
                <p style="font-weight: bold; text-align: center;">新增收货地址</p>

                <label>收货人：</label>
                <input type="text" id="receiver" placeholder="请输入姓名" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;"><br>

                <label>手机号：</label>
                <input type="tel" id="phone" placeholder="请输入手机号" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;"><br>

                <label>省份：</label>
                <input type="text" id="province" placeholder="省" style="width: 30%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="city" placeholder="市" style="width: 30%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="district" placeholder="区" style="width: 30%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;"><br>

                <label>详细地址：</label>
                <textarea id="detail" placeholder="街道、小区、门牌号" rows="2" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea><br>

                <div style="display: flex; gap: 10px;">
                    <button type="button" onclick="saveAddress()" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">保存地址</button>
                    <button type="button" onclick="hideAddAddressForm()" style="padding: 8px 16px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">取消</button>
                </div>
            </div>
        </div>

        <div style="">
            <button type="button" onclick="Pay()" style="padding: 8px 16px;">购买</button>
        </div>

        <script>
            let selectedAddressId = null;

            // 页面加载时获取地址列表
            loadAddressList();

            // 从后端加载地址列表
            function loadAddressList() {
                fetch('/address/list')
                    .then(response => response.json())
                    .then(data => {
                        let select = document.getElementById('addressSelect');
                        select.innerHTML = '';

                        if (data && data.length > 0) {
                            let defaultOption = document.createElement('option');
                            defaultOption.value = '';
                            defaultOption.text = '请选择收货地址';
                            select.appendChild(defaultOption);

                            for (let i = 0; i < data.length; i++) {
                                let option = document.createElement('option');
                                option.value = data[i].id;
                                option.text = data[i].receiver + '，' + data[i].phone + '，' +
                                    data[i].province + data[i].city + data[i].district + data[i].detail;
                                select.appendChild(option);
                            }
                        } else {
                            select.innerHTML = '<option value="">暂无地址，请点击"新增地址"</option>';
                        }
                    })
                    .catch(error => {
                        console.error("获取地址失败：", error);
                    });
            }

            // 显示新增地址表单
            function showAddAddressForm() {
                document.getElementById('addAddressForm').style.display = 'block';
            }

            // 隐藏新增地址表单
            function hideAddAddressForm() {
                document.getElementById('addAddressForm').style.display = 'none';
                // 清空表单
                document.getElementById('receiver').value = '';
                document.getElementById('phone').value = '';
                document.getElementById('province').value = '';
                document.getElementById('city').value = '';
                document.getElementById('district').value = '';
                document.getElementById('detail').value = '';
            }

            // 保存新地址
            function saveAddress() {
                // 获取表单数据
                let receiver = document.getElementById('receiver').value;
                let phone = document.getElementById('phone').value;
                let province = document.getElementById('province').value;
                let city = document.getElementById('city').value;
                let district = document.getElementById('district').value;
                let detail = document.getElementById('detail').value;

                // 验证必填项
                if (!receiver) {
                    alert('请输入收货人姓名');
                    return;
                }
                if (!phone) {
                    alert('请输入手机号');
                    return;
                }
                if (!detail) {
                    alert('请输入详细地址');
                    return;
                }

                // 构建要发送的数据
                let addressData = {
                    receiver: receiver,
                    phone: phone,
                    province: province || '',  // 选填，没填就传空字符串
                    city: city || '',
                    district: district || '',
                    detail: detail
                };

                // 发送请求到后端
                fetch('/address/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(addressData)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('地址添加成功！');
                            hideAddAddressForm();      // 隐藏表单
                            loadAddressList();         // 刷新地址列表
                        } else {
                            alert('添加失败：' + data.message);
                        }
                    })
                    .catch(error => {
                        console.error("保存地址失败：", error);
                        alert('保存失败，请重试');
                    });
            }

            // 监听下拉框选择
            document.getElementById('addressSelect').onchange = function() {
                selectedAddressId = this.value;
            };

            // 定义微信支付函数
            function Pay() {
                // confirm() 是弹出一个确认框，让用户选择"确定"或"取消"
                // 如果用户点击"确定"，返回 true；点击"取消"，返回 false
                if (confirm('确认支付 ¥[[${goods.price}]] 吗？')) {
                    // alert() 是弹出一个提示框，告诉用户支付成功
                    alert('支付成功！');
                    // window.location.href 是页面跳转，这里跳转到订单列表页
                    window.location.href = '/';
                }
                // 如果用户点击"取消"，什么都不做，直接结束
            }
        </script>

    </div>
</body>
</html>
