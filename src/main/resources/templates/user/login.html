<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账户</title>
    <style>
        .error {
            color: red;
            background-color: #ffeeee;
            border: 1px solid red;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<!--
    text-align: center;	文字/内容水平居中：让 div 内部的图片在水平方向上居中显示
    margin-bottom: 20px;	底部外边距 20 像素：让这个 div 距离它下面的元素有 20px 的空白距离
-->
<div style="text-align: center; margin-bottom: 20px;">
    <!--
        alt: 图片加载失败时加载什么
        height: auto;	图片高度自动按原始比例计算
    -->
    <img src="/image/login.jpg" alt="Logo" style="width: 500px; height: auto;">
</div>

<div th:if="${error}" class="error" th:text="${error}" style="width: 500px; margin: 0 auto;text-align: center;"></div>

<form method="post" action="/login" style="margin-bottom: 20px;">
    <!--
        display: flex	开启弹性布局
        flex-direction: column	子元素垂直排列
        gap: 15px	子元素之间间隔15像素
        max-width: 300px	容器最宽不超过300像素
        margin: 0 auto	容器水平居中
        padding-top:    整体下移
     -->
    <div style="display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto;padding-top: 20px;text-align: center">
        <!-- 用户名输入框 -->
        <!--
            type="text" 明文 输入什么就是什么
            type="text" 密文 输入什么就是*
            placeholder 灰字
        -->
        <input type="text" name="username" placeholder="输入账户名称"
               style="padding: 8px; width: 100%;"
               th:value="${username}">

        <!-- 密码输入框 -->
        <input type="password" name="password" placeholder="输入密码"
               style="padding: 8px; width: 100%;"
               th:value="${password}">

        <!-- 提交按钮 -->
        <!--
            padding	内边距	内容与边框之间的内部留白
            margin	外边距	元素与外部其他元素之间的留白
            border	边框	元素边框样式

            e.g.:
            padding: 10px;	上下左右都是10px
            padding: 8px 16px;	上下8px，左右16px
            padding: 8px 16px 8px 16px;	上、右、下、左（顺时针）

            width	宽度
            max-width	最大宽度
            margin: 0 auto	水平居中
            color	文字颜色	white、#007bff、black
            font-size	文字大小	16px、18px、20px
            text-align	文字对齐	center（居中）、left（左对齐）
            text-decoration	文字装饰	none（去掉下划线）
            background-color	背景颜色
            border-radius	圆角	4px（小圆角）、20px（大圆角）
            border: none	去掉边框
            cursor: pointer	鼠标变手型
        -->
        <button type="submit" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            登录
        </button>
    </div>
</form>

<div style="max-width: 300px; margin: 0 auto; text-align: center">
    <a href="/register" style="display: block; padding: 8px 16px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">
        注册
    </a>
</div>

</body>
</html>
